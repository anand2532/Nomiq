name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make test
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 tools/lora_airtime.py --table
      - run: bash -n tools/gitbot/gitflow.sh
      - run: python3 -m json.tool .mcp.json > /dev/null
  enclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # non-blocking until first green run (not runnable in authoring sandbox)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build123d
      - name: build enclosure
        run: |
          set -o pipefail
          python3 mechanical/enclosure/enclosure.py --out mechanical/exports 2>&1 | tee enclosure.log || {
            tail -n 40 enclosure.log | while IFS= read -r l; do echo "::error title=enclosure::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with: {name: enclosure, path: mechanical/exports/}
  kicad-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # non-blocking: informational ERC until placeholder pads are verified
    container: kicad/kicad:8.0
    steps:
      - uses: actions/checkout@v4
      - name: ERC
        run: |
          cd hardware/kicad/nomiq
          kicad-cli sch erc --format report --severity-error -o erc.rpt nomiq.kicad_sch || true
          cat erc.rpt
          kicad-cli sch export netlist -o nomiq.net nomiq.kicad_sch
          grep -c "(net (code" nomiq.net
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-erc
          path: hardware/kicad/nomiq/erc.rpt
  firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true   # non-blocking until the first green CI run (builds locally with IDF v5.3.2)
    container: espressif/idf:v5.3.2
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: devkit-linktest
            extra: ""
          - name: pcb-messenger
            extra: "CONFIG_NOMIQ_APP_MESSENGER=y\nCONFIG_NOMIQ_BOARD_PCB_A0=y"
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build (${{ matrix.config.name }})
        shell: bash
        run: |
          set -o pipefail
          . $IDF_PATH/export.sh
          cd firmware
          printf "${{ matrix.config.extra }}\n" > sdkconfig.ci
          (idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci" set-target esp32s3 && idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci" build) 2>&1 | tee build.log || {
            grep -E "error|Error|ERROR|undefined reference" build.log | head -n 40 | while IFS= read -r l; do echo "::error title=firmware ${{ matrix.config.name }}::$l"; done
            exit 1; }
          idf.py size | tail -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.config.name }}
          path: |
            firmware/build/nomiq.bin
            firmware/build/nomiq.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
