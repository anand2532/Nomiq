name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make test
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 tools/lora_airtime.py --table
      - run: bash -n tools/gitbot/gitflow.sh
      - run: python3 -m json.tool .mcp.json > /dev/null
  enclosure:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking until first green run (not runnable in authoring sandbox)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build123d
      - name: build enclosure
        run: |
          set -o pipefail
          python3 mechanical/enclosure/enclosure.py --out mechanical/exports 2>&1 | tee enclosure.log || {
            tail -n 40 enclosure.log | while IFS= read -r l; do echo "::error title=enclosure::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with: {name: enclosure, path: mechanical/exports/}
  firmware-build:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking until ESP-IDF build verified (Phase 1)
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build
        shell: bash
        run: |
          set -o pipefail
          . $IDF_PATH/export.sh
          cd firmware
          (idf.py set-target esp32s3 && idf.py build) 2>&1 | tee build.log || {
            grep -E "error|Error|ERROR|undefined reference" build.log | head -n 40 | while IFS= read -r l; do echo "::error title=firmware::$l"; done
            exit 1; }
